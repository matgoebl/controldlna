buildscript {
    repositories {
        mavenCentral()
        jcenter()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.1.2'
        classpath 'com.alexvasilkov:android_sign:0.2'
    }
}

apply plugin: 'android_sign'
apply plugin: 'com.android.application'

repositories {
    mavenCentral()
    jcenter()
    maven {
        url "http://4thline.org/m2"
    }
    maven {
        url 'https://maven.google.com/'
        name 'Google'
    }
}

dependencies {
    implementation 'com.android.support:appcompat-v7:21.0.3'
    implementation 'com.android.support:mediarouter-v7:21.0.3'
    implementation 'org.fourthline.cling:cling-core:2.1.1'
    implementation 'org.fourthline.cling:cling-support:2.1.1'
    implementation 'org.eclipse.jetty:jetty-server:8.1.8.v20121106'
    implementation 'org.eclipse.jetty:jetty-servlet:8.1.8.v20121106'
    implementation 'org.eclipse.jetty:jetty-client:8.1.8.v20121106'
    implementation 'org.slf4j:slf4j-jdk14:1.6.1'
    implementation 'org.jetbrains.trove4j:trove4j:20160824'
}

android {
    compileSdkVersion 21

	// Caused by cling, because they apparently include APIs for other platforms.
	lintOptions {
		disable 'InvalidPackage'
		abortOnError false
	}

    packagingOptions {
        exclude 'META-INF/beans.xml'
        exclude 'about.html'
    }

    defaultConfig {
        buildConfigField "long", "TIMESTAMP", System.currentTimeMillis() + "L"
    }

    signingConfigs {
        release {
            def keyStore = System.getenv("ANDROID_KEYSTORE")
            if (keyStore != null && keyStore != "") {
                def keyStoreFile = keyStore + "/keystore"
                def keyPropertiesFile = keyStore + "/keyprops"
                project.logger.lifecycle("ANDROID KEYSTORE: Using store ${keyStoreFile} with properties ${keyPropertiesFile}")
                storeFile file(keyStoreFile)
                def kP = new Properties()
                kP.load(new FileInputStream(keyPropertiesFile))
                storePassword kP['storePassword']
                keyAlias kP['keyAlias']
                keyPassword kP['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
        }
    }

}

task wrapper(type: Wrapper) {
    gradleVersion = '1.10'
}
